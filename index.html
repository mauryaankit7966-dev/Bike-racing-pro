
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bike Racing 3D</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09131f;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:12px;left:10px;right:10px;display:flex;justify-content:space-between;gap:6px;pointer-events:none;color:white;z-index:2}
.pill{background:#07111ddd;border:1px solid #ffffff44;border-radius:12px;padding:8px 10px;font-size:15px;font-weight:bold}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;background:#06101a99;z-index:4}
.panel{width:min(430px,100%);padding:24px 20px;border-radius:22px;background:#101e2df2;color:white;text-align:center;border:1px solid #ffffff44}
h1{font-size:29px;color:#ffd34e;margin:0 0 12px}
p{line-height:1.5;color:#d9e5f2}
button{border:0;border-radius:13px;padding:14px 18px;font-size:18px;font-weight:bold;background:#ffbd2e;color:#17202b}
#start{width:100%;margin-top:12px}
#controls{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;padding:0 22px;z-index:3;pointer-events:none}
.ctrl{pointer-events:auto;width:78px;height:68px;border-radius:18px;background:#07111ddd;color:white;border:1px solid #ffffff66;font-size:30px;touch-action:none}
#pause{position:fixed;right:12px;top:62px;z-index:3;padding:9px 13px;font-size:14px}
.hidden{display:none!important}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
 <div class="pill">स्कोर: <span id="score">0</span></div>
 <div class="pill">कॉइन: <span id="coins">0</span></div>
 <div class="pill">स्पीड: <span id="speed">0</span></div>
</div>

<button id="pause" class="hidden">⏸ रोकें</button>

<div id="controls" class="hidden">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="right">▶</button>
</div>

<div id="menu">
 <div class="panel">
  <h1>🏍️ BIKE RACING 3D</h1>
  <p id="msg">ट्रैफिक से बचें और कॉइन इकट्ठा करें।</p>
  <button id="start">START RACE</button>
  <p style="font-size:13px">
   मोबाइल: नीचे के बटन दबाएँ<br>
   कंप्यूटर: ← → या A / D
  </p>
 </div>
</div>

<script>
(()=>{
"use strict";

const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

let W=0,H=0,dpr=1;
let playing=false,paused=false,steer=0;
let score=0,coins=0,speed=260,player=0;
let last=0,spawn=0,coinSpawn=0;
let traffic=[],gold=[];

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth;
 H=innerHeight;
 canvas.width=W*dpr;
 canvas.height=H*dpr;
 ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize);
resize();

function polygon(points,color){
 ctx.fillStyle=color;
 ctx.beginPath();
 ctx.moveTo(points[0][0],points[0][1]);
 for(let i=1;i<points.length;i++)
  ctx.lineTo(points[i][0],points[i][1]);
 ctx.closePath();
 ctx.fill();
}

function roadY(t){
 return H*.30+Math.pow(t,1.55)*H*.78;
}

function roadHalf(t){
 return W*(.035+Math.pow(t,1.2)*.47);
}

function laneX(lane,t){
 return W/2+lane*roadHalf(t)*.62;
}

function drawRoad(){
 let horizon=H*.30;

 let sky=ctx.createLinearGradient(0,0,0,horizon);
 sky.addColorStop(0,'#64b8e8');
 sky.addColorStop(1,'#d8edff');
 ctx.fillStyle=sky;
 ctx.fillRect(0,0,W,horizon);

 ctx.fillStyle='#408c42';
 ctx.fillRect(0,horizon,W,H-horizon);

 polygon([
  [0,horizon+10],[W*.13,horizon-28],
  [W*.25,horizon+4],[W*.42,horizon-38],
  [W*.59,horizon+3],[W*.78,horizon-32],
  [W,horizon+8],[W,H],[0,H]
 ],'#548c50');

 polygon([
  [W/2-roadHalf(0),horizon],
  [W/2+roadHalf(0),horizon],
  [W/2+roadHalf(1),H],
  [W/2-roadHalf(1),H]
 ],'#343b45');

 polygon([
  [W/2-roadHalf(0)-5,horizon],
  [W/2-roadHalf(0),horizon],
  [W/2-roadHalf(1),H],[0,H]
 ],'#d7d4c8');

 polygon([
  [W/2+roadHalf(0),horizon],
  [W/2+roadHalf(0)+5,horizon],
  [W,H],[W/2+roadHalf(1),H]
 ],'#d7d4c8');

 for(let i=0;i<13;i++){
  let t=((i/13+(score/170)%1)%1);
  let y=roadY(t),half=roadHalf(t);
  let w=2+t*5;

  for(let lane of [-1,1]){
   let x=W/2+lane*half/3;
   ctx.fillStyle='#f8f5df';
   ctx.fillRect(x-w/2,y,w,Math.max(2,2+t*17));
  }
 }

 for(let i=0;i<9;i++){
  let t=((i/9+(score/300)%1)%1);
  let y=roadY(t),s=8+t*30;

  for(let side of [-1,1]){
   let x=W/2+side*(roadHalf(t)+s*.9);
   ctx.fillStyle='#65442b';
   ctx.fillRect(x-s*.09,y-s*.5,s*.18,s*.6);

   ctx.fillStyle='#176b35';
   ctx.beginPath();
   ctx.arc(x,y-s*.6,s*.42,0,Math.PI*2);
   ctx.fill();
  }
 }
}

function drawBike(x,y,s){
 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);

 ctx.fillStyle='#0006';
 ctx.beginPath();
 ctx.ellipse(0,5,28,10,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#111';
 ctx.beginPath();
 ctx.ellipse(0,18,9,21,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#9da8b1';
 ctx.beginPath();
 ctx.ellipse(0,18,3,13,0,0,Math.PI*2);
 ctx.fill();

 polygon([
  [-19,6],[-12,-9],[-5,-14],
  [8,-12],[20,4],[11,12],[-10,12]
 ],'#e6263e');

 polygon([
  [-8,-12],[4,-23],[14,-18],[9,-9]
 ],'#f3f5f8');

 ctx.fillStyle='#1765c9';
 ctx.beginPath();
 ctx.ellipse(0,-27,10,17,-.2,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#ffd0a0';
 ctx.beginPath();
 ctx.arc(0,-44,9,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle='#ffca28';
 ctx.beginPath();
 ctx.arc(0,-47,10,Math.PI,Math.PI*2);
 ctx.fill();

 ctx.strokeStyle='#bbb';
 ctx.lineWidth=3;
 ctx.beginPath();
 ctx.moveTo(-15,-12);
 ctx.lineTo(15,-12);
 ctx.stroke();

 ctx.restore();
}

function drawCar(o){
 let t=o.t;
 let y=roadY(t);
 let x=laneX(o.lane,t);
 let s=.18+t*.95;

 ctx.save();
 ctx.translate(x,y);
 ctx.scale(s,s);

 ctx.fillStyle='#0005';
 ctx.beginPath();
 ctx.ellipse(0,4,30,9,0,0,Math.PI*2);
 ctx.fill();

 ctx.fillStyle=o.color;
 ctx.beginPath();
 ctx.roundRect(-24,-37,48,42,8);
 ctx.fill();

 ctx.fillStyle='#a9dff3';
 ctx.beginPath();
 ctx.roundRect(-17,-32,34,15,4);
 ctx.fill();

 ctx.fillStyle='#171b20';
 ctx.fillRect(-27,-7,7,14);
 ctx.fillRect(20,-7,7,14);

 ctx.fillStyle='#ffedaa';
 ctx.fillRect(-18,0,8,4);
 ctx.fillRect(10,0,8,4);

 ctx.restore();
}

function drawCoin(o){
 let t=o.t;
 let y=roadY(t);
 let x=laneX(o.lane,t);
 let s=.2+t*.8;

 ctx.save();
 ctx.translate(x,y-18*s);
 ctx.scale(s,s);

 ctx.fillStyle='#ffda22';
 ctx.strokeStyle='#b87900';
 ctx.lineWidth=4;

 ctx.beginPath();
 ctx.arc(0,0,13,0,Math.PI*2);
 ctx.fill();
 ctx.stroke();

 ctx.fillStyle='#a76b00';
 ctx.font='bold 17px Arial';
 ctx.textAlign='center';
 ctx.textBaseline='middle';
 ctx.fillText('$',0,1);

 ctx.restore();
}

function render(){
 ctx.clearRect(0,0,W,H);
 drawRoad();

 [...traffic.map(o=>({type:'car',o})),
  ...gold.map(o=>({type:'coin',o}))]
 .sort((a,b)=>a.o.t-b.o.t)
 .forEach(v=>{
  if(v.type==='car')drawCar(v.o);
  else drawCoin(v.o);
 });

 drawBike(
  W/2+player*W*.28,
  H*.82,
  Math.min(1.15,W/390)
 );
}

function hud(){
 $('score').textContent=Math.floor(score);
 $('coins').textContent=coins;
 $('speed').textContent=Math.floor(speed/3.6);
}

function start(){
 playing=true;
 paused=false;
 score=0;
 coins=0;
 speed=260;
 player=0;
 spawn=0;
 coinSpawn=0;
 traffic=[];
 gold=[];
 hud();

 $('menu').classList.add('hidden');
 $('controls').classList.remove('hidden');
 $('pause').classList.remove('hidden');
 $('pause').textContent='⏸ रोकें';

 last=performance.now();
}

function finish(){
 playing=false;

 $('menu').classList.remove('hidden');
 $('controls').classList.add('hidden');
 $('pause').classList.add('hidden');

 $('msg').textContent=
  'गेम खत्म! स्कोर: '+Math.floor(score)+' • कॉइन: '+coins;

 $('start').textContent='फिर से खेलें';
}

function frame(now){
 requestAnimationFrame(frame);

 let dt=Math.min((now-last)/1000||0,.04);
 last=now;

 if(playing&&!paused){
  score+=dt*10;
  speed=Math.min(430,260+score*.25);

  player=Math.max(-.9,Math.min(.9,
   player+steer*dt*1.7
  ));

  spawn+=dt;
  coinSpawn+=dt;

  if(spawn>Math.max(.65,1.35-score/900)){
   traffic.push({
    lane:Math.floor(Math.random()*3)-1,
    t:0,
    color:['#f28b25','#2784db','#eeeeee','#9252cf']
     [Math.floor(Math.random()*4)]
   });
   spawn=0;
  }

  if(coinSpawn>1){
   gold.push({
    lane:Math.floor(Math.random()*3)-1,
    t:0
   });
   coinSpawn=0;
  }

  let advance=dt*(.42+speed/550);
  traffic.forEach(o=>o.t+=advance);
  gold.forEach(o=>o.t+=advance);

  const px=W/2+player*W*.28;

  for(let i=traffic.length-1;i>=0;i--){
   let o=traffic[i];

   if(o.t>.78&&o.t<.99&&
      Math.abs(laneX(o.lane,o.t)-px)<W*.085){
    finish();
    break;
   }

   if(o.t>1.15)traffic.splice(i,1);
  }

  for(let i=gold.length-1;i>=0;i--){
   let o=gold[i];

   if(o.t>.79&&o.t<.98&&
      Math.abs(laneX(o.lane,o.t)-px)<W*.09){
    coins++;
    score+=20;
    gold.splice(i,1);
   }else if(o.t>1.15){
    gold.splice(i,1);
   }
  }

  hud();
 }

 render();
}

$('start').addEventListener('click',start);

$('pause').addEventListener('click',()=>{
 if(!playing)return;
 paused=!paused;
 $('pause').textContent=
  paused?'▶ जारी रखें':'⏸ रोकें';
});

function hold(id,val){
 let el=$(id);

 el.addEventListener('pointerdown',e=>{
  e.preventDefault();
  steer=val;
  el.setPointerCapture(e.pointerId);
 });

 ['pointerup','pointercancel','lostpointercapture'].forEach(ev=>{
  el.addEventListener(ev,()=>{
   if(steer===val)steer=0;
  });
 });
}

hold('left',-1);
hold('right',1);

addEventListener('keydown',e=>{
 if(['ArrowLeft','a','A'].includes(e.key))steer=-1;
 if(['ArrowRight','d','D'].includes(e.key))steer=1;

 if(e.key===' '&&playing){
  paused=!paused;
  $('pause').textContent=
   paused?'▶ जारी रखें':'⏸ रोकें';
 }
});

addEventListener('keyup',e=>{
 if(['ArrowLeft','a','A'].includes(e.key)&&steer<0)steer=0;
 if(['ArrowRight','d','D'].includes(e.key)&&steer>0)steer=0;
});

requestAnimationFrame(frame);
})();
</script>
</body>
</html>
