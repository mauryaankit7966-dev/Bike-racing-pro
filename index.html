
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Bike Racing 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;font-family:Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;z-index:5;color:white;pointer-events:none}
.pill{background:#07111dcc;border:1px solid #ffffff35;border-radius:12px;padding:8px 12px;font-weight:bold;text-shadow:0 1px 2px #000}
#menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:linear-gradient(#06101a88,#06101acc);padding:18px}
.panel{width:min(420px,100%);padding:24px;border-radius:20px;background:#101c2af2;color:white;text-align:center;border:1px solid #ffffff30;box-shadow:0 12px 50px #0008}
h1{margin:0 0 8px;font-size:30px;color:#ffd34e}p{line-height:1.45;color:#d6e1ee}
button{border:0;border-radius:12px;padding:13px 18px;font-size:17px;font-weight:bold;background:#ffbd2e;color:#18202b;cursor:pointer}
#start{width:100%;margin-top:10px}#hint{font-size:13px;color:#b9c7d8}
#controls{position:fixed;bottom:22px;left:0;right:0;z-index:6;display:flex;justify-content:space-between;padding:0 22px;pointer-events:none}
.ctrl{pointer-events:auto;width:76px;height:66px;border-radius:18px;background:#07111dcc;color:white;border:1px solid #ffffff55;font-size:28px;touch-action:none}
#pause{position:fixed;right:12px;top:66px;z-index:7;padding:9px 13px;font-size:14px}
.hidden{display:none!important}
#error{position:fixed;bottom:4px;left:5px;right:5px;color:#ffb4b4;font-size:12px;text-align:center;z-index:20;pointer-events:none}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div class="pill">स्कोर: <span id="score">0</span></div>
 <div class="pill">कॉइन: <span id="coins">0</span></div>
 <div class="pill">स्पीड: <span id="speed">0</span></div>
</div>
<button id="pause" class="hidden">⏸ रोकें</button>
<div id="controls" class="hidden">
 <button class="ctrl" id="left">◀</button>
 <button class="ctrl" id="right">▶</button>
</div>
<div id="menu">
 <div class="panel">
  <h1>🏍️ BIKE RACING 3D</h1>
  <p id="message">ट्रैफिक से बचें और ज्यादा से ज्यादा कॉइन इकट्ठा करें।</p>
  <button id="start">START RACE</button>
  <p id="hint">मोबाइल: नीचे के बटन दबाएँ • कंप्यूटर: ← → या A / D</p>
 </div>
</div>
<div id="error"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const game=$("game"), menu=$("menu"), startBtn=$("start"), pauseBtn=$("pause");
let scene,camera,renderer,clock,bike,roadGroup,playerX=0,steer=0;
let obstacles=[],coins3d=[],roadMarks=[],decor=[];
let running=false,paused=false,score=0,coins=0,speed=24,spawnTimer=0,coinTimer=0;
let animationStarted=false;
const lanes=[-3,0,3];
function showError(msg){$("error").textContent=msg;}
function mat(color,roughness=.8){return new THREE.MeshStandardMaterial({color,roughness});}
function addBox(parent,w,h,d,color,x,y,z){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(color));
 m.position.set(x,y,z);parent.add(m);return m;
}
function makeBike(){
 const g=new THREE.Group();
 addBox(g,.85,.45,1.55,0xff263d,0,.7,0);
 addBox(g,.62,.35,.55,0x151b25,0,1.05,-.15);
 // wheels
 for(const z of [-.58,.62]){
  const wheel=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.18,20),mat(0x111111));
  wheel.rotation.z=Math.PI/2;wheel.position.set(0,.38,z);g.add(wheel);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.2,16),mat(0xb8c4d2));
  hub.rotation.z=Math.PI/2;hub.position.set(0,.38,z);g.add(hub);
 }
 // rider body and helmet
 const body=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),mat(0x246bdb));
 body.scale.set(.8,1.3,.7);body.position.set(0,1.45,-.12);g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.24,16,12),mat(0xffd3a1));
 head.position.set(0,1.9,.05);g.add(head);
 const helmet=new THREE.Mesh(new THREE.SphereGeometry(.26,16,12),mat(0xffc928));
 helmet.position.set(0,2.03,.05);g.add(helmet);
 const handle=addBox(g,1.2,.08,.12,0xaaaaaa,0,1.22,.55);
 g.position.set(0,0,4);
 scene.add(g);return g;
}
function buildWorld(){
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8bc8ee);scene.fog=new THREE.Fog(0x8bc8ee,35,115);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);
 camera.position.set(0,6.3,11.5);camera.lookAt(0,1,-10);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=true;game.innerHTML="";game.appendChild(renderer.domElement);
 scene.add(new THREE.HemisphereLight(0xffffff,0x526070,2));
 const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-8,15,8);scene.add(sun);
 // ground and road
 const ground=new THREE.Mesh(new THREE.PlaneGeometry(150,180),mat(0x4d9b55));ground.rotation.x=-Math.PI/2;ground.position.set(0,-.08,-45);scene.add(ground);
 const road=new THREE.Mesh(new THREE.PlaneGeometry(10,180),mat(0x343b46));road.rotation.x=-Math.PI/2;road.position.set(0,0,-45);scene.add(road);
 // road edges
 for(const x of [-5.15,5.15]){const edge=new THREE.Mesh(new THREE.BoxGeometry(.18,.06,180),mat(0xffffff));edge.position.set(x,.04,-45);scene.add(edge);}
 roadMarks=[];
 for(let z=12;z>-100;z-=9){for(const x of [-1.67,1.67]){
  const mark=new THREE.Mesh(new THREE.BoxGeometry(.12,.035,4),mat(0xf4f4f4));mark.position.set(x,.04,z);scene.add(mark);roadMarks.push(mark);
 }}
 // roadside trees and simple buildings
 decor=[];
 for(let z=12;z>-100;z-=10){
  for(const side of [-1,1]){
   const x=side*(8+Math.random()*4);
   if(Math.random()>.35){
    const trunk=addBox(scene,.35,2,.35,0x79512e,x,1,z);
    const crown=new THREE.Mesh(new THREE.ConeGeometry(1.25,3,8),mat(0x16733a));crown.position.set(x,3.2,z);scene.add(crown);
    decor.push(trunk,crown);
   }else{
    const b=addBox(scene,2+Math.random()*2,2+Math.random()*5,2,0xc6a57d,x,1.2,z);
    decor.push(b);
   }
  }
 }
 obstacles=[];coins3d=[];
 bike=makeBike();clock=new THREE.Clock();
}
function makeTraffic(){
 const colors=[0xff8c28,0x2e7de0,0xe9e9e9,0x9a55d6];
 const g=new THREE.Group();
 const body=addBox(g,1.45,.85,2.2,colors[Math.floor(Math.random()*colors.length)],0,.72,0);
 addBox(g,1.1,.55,1,0x9ed7ef,0,1.35,-.12);
 for(const x of [-.53,.53])for(const z of [-.7,.7]){
  const w=new THREE.Mesh(new THREE.CylinderGeometry(.23,.23,.15,14),mat(0x111111));w.rotation.z=Math.PI/2;w.position.set(x,.3,z);g.add(w);
 }
 g.position.set(lanes[Math.floor(Math.random()*3)],0,-90);scene.add(g);obstacles.push(g);
}
function makeCoin(){
 const c=new THREE.Mesh(new THREE.TorusGeometry(.42,.13,10,20),new THREE.MeshStandardMaterial({color:0xffd21f,metalness:.65,roughness:.25}));
 c.position.set(lanes[Math.floor(Math.random()*3)],1,-90);scene.add(c);coins3d.push(c);
}
function reset(){
 obstacles.forEach(o=>scene.remove(o));coins3d.forEach(o=>scene.remove(o));
 obstacles=[];coins3d=[];playerX=0;bike.position.x=0;
 score=0;coins=0;speed=24;spawnTimer=0;coinTimer=0;steer=0;updateHud();
}
function updateHud(){
 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("speed").textContent=Math.floor(speed*3.6);
}
function begin(){
 if(!renderer){showError("3D लोड नहीं हुआ। इंटरनेट चालू करके पेज दोबारा खोलें।");return;}
 reset();running=true;paused=false;
 menu.classList.add("hidden");$("controls").classList.remove("hidden");pauseBtn.classList.remove("hidden");
 pauseBtn.textContent="⏸ रोकें";clock.getDelta();
}
function endGame(){
 running=false;paused=false;menu.classList.remove("hidden");$("controls").classList.add("hidden");pauseBtn.classList.add("hidden");
 $("message").textContent="गेम खत्म! आपका स्कोर: "+Math.floor(score)+" • कॉइन: "+coins;
 startBtn.textContent="फिर से खेलें";
}
function setSteer(v){steer=v;}
function bindHold(id,v){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();setSteer(v);});
 ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,()=>{if(steer===v)setSteer(0);}));
}
bindHold("left",-1);bindHold("right",1);
window.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")steer=-1;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")steer=1;
 if(e.key===" "&&running){paused=!paused;pauseBtn.textContent=paused?"▶ जारी रखें":"⏸ रोकें";}
});
window.addEventListener("keyup",e=>{
 if(["ArrowLeft","a","A"].includes(e.key)&&steer<0)steer=0;
 if(["ArrowRight","d","D"].includes(e.key)&&steer>0)steer=0;
});
pauseBtn.addEventListener("click",()=>{if(!running)return;paused=!paused;pauseBtn.textContent=paused?"▶ जारी रखें":"⏸ रोकें";});
startBtn.addEventListener("click",begin);
function update(dt){
 if(!running||paused)return;
 score+=dt*10;speed=Math.min(48,24+score/180);
 playerX+=steer*dt*7;playerX=Math.max(-3.5,Math.min(3.5,playerX));
 bike.position.x=playerX;bike.rotation.z=-steer*.12;
 spawnTimer+=dt;coinTimer+=dt;
 if(spawnTimer>Math.max(.65,1.45-score/800)){makeTraffic();spawnTimer=0;}
 if(coinTimer>1.05){makeCoin();coinTimer=0;}
 const move=speed*dt;
 roadMarks.forEach(m=>{m.position.z+=move;if(m.position.z>15)m.position.z-=108;});
 decor.forEach(o=>{o.position.z+=move;if(o.position.z>18)o.position.z-=110;});
 for(let i=obstacles.length-1;i>=0;i--){
  const o=obstacles[i];o.position.z+=move;
  if(Math.abs(o.position.z-bike.position.z)<1.5&&Math.abs(o.position.x-playerX)<1.35){endGame();return;}
  if(o.position.z>12){scene.remove(o);obstacles.splice(i,1);}
 }
 for(let i=coins3d.length-1;i>=0;i--){
  const c=coins3d[i];c.position.z+=move;c.rotation.y+=dt*4;
  if(Math.abs(c.position.z-bike.position.z)<1.6&&Math.abs(c.position.x-playerX)<1.2){
   coins++;score+=25;scene.remove(c);coins3d.splice(i,1);
  }else if(c.position.z>12){scene.remove(c);coins3d.splice(i,1);}
 }
 updateHud();
}
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock?clock.getDelta():0,.05);
 if(running&&!paused)update(dt);
 if(bike){camera.position.x+=(bike.position.x*.22-camera.position.x)*.04;camera.lookAt(bike.position.x*.15,1,-10);}
 if(renderer&&scene&&camera)renderer.render(scene,camera);
}
function init(){
 try{
  if(!window.THREE)throw new Error("Three.js CDN load नहीं हुआ");
  buildWorld();
  if(!animationStarted){animationStarted=true;animate();}
 }catch(err){showError("लोडिंग समस्या: "+err.message+" | इंटरनेट चालू करके दोबारा खोलें।");console.error(err);}
}
window.addEventListener("resize",()=>{
 if(!renderer||!camera)return;
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);
});
init();
})();
</script>
</body>
</html>
