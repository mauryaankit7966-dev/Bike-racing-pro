
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>BIKE RACING PRO 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07101c;color:white;font-family:Arial;touch-action:none}
#game{position:fixed;inset:0}
#game canvas{display:block;width:100%;height:100%}
button,select{border:0;border-radius:11px;padding:11px;background:#ed254c;color:white;font-weight:bold;font-size:14px}
button:active{transform:scale(.95)}
#hud{position:absolute;top:8px;left:0;width:100%;display:flex;justify-content:space-around;z-index:2;pointer-events:none}
.stat{background:#07101ddd;padding:9px;border-radius:10px;font-size:13px}
#menu{position:absolute;inset:0;z-index:5;background:linear-gradient(135deg,#091629f5,#102d43f5);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:9px;padding:12px;overflow:auto}
#menu h1{font-size:28px;color:#ff3155;margin:4px}
#menu p{margin:4px;color:#c6d7e9}
.panel{background:#15263dcc;border:1px solid #ffffff22;border-radius:14px;padding:12px;width:min(340px,95%)}
select{width:100%;background:#20334c;margin:5px 0}
.menuButtons{display:grid;grid-template-columns:1fr 1fr;gap:7px;width:min(340px,95%)}
.menuButtons button{font-size:12px}
#controls{position:absolute;bottom:10px;left:0;width:100%;display:flex;justify-content:space-around;gap:3px;z-index:3}
#controls button{width:19%;height:58px;padding:3px;background:#101c31e8;border:1px solid #ffffff66;font-size:12px}
#controls .gas{background:#ed254c}
#top{position:absolute;right:7px;top:57px;z-index:3;display:flex;gap:5px}
#top button{font-size:11px;padding:8px}
#tiltStatus{position:absolute;top:60px;left:7px;background:#07101dcc;padding:8px;border-radius:8px;font-size:11px;z-index:3}
#message{position:absolute;top:40%;width:100%;text-align:center;font-size:27px;font-weight:bold;text-shadow:0 3px 8px black;z-index:4;pointer-events:none}
.hidden{display:none!important}
#help{max-width:330px;font-size:12px}
</style>
</head>
<body>
<div id="game"></div>

<div id="hud">
 <div class="stat">⚡ <span id="speed">0</span> KM/H</div>
 <div class="stat">🏆 <span id="score">0</span></div>
 <div class="stat">🪙 <span id="coins">0</span></div>
</div>

<div id="tiltStatus">📱 Tilt: OFF</div>
<div id="top">
 <button onclick="toggleSound()">🔊 SOUND</button>
 <button onclick="pauseGame()">⏸ PAUSE</button>
</div>
<div id="message"></div>

<div id="controls">
 <button id="left">◀ LEFT</button>
 <button id="brake">BRAKE</button>
 <button id="nitro">⚡ NITRO</button>
 <button id="gas" class="gas">GO ▲</button>
 <button id="right">RIGHT ▶</button>
</div>

<div id="menu">
 <h1>🏍️ BIKE RACING PRO</h1>
 <p>ULTIMATE 3D MOTORCYCLE RACING</p>
 <div class="panel">
  <p>SELECT MAP</p>
  <select id="map">
   <option value="city">🏙️ City Highway</option>
   <option value="village">🌳 Village Road</option>
   <option value="desert">🏜️ Desert Road</option>
   <option value="river">🌊 River Bridge</option>
  </select>
  <p>SELECT BIKE COLOR</p>
  <select id="color">
   <option value="red">Red Superbike</option>
   <option value="blue">Blue Superbike</option>
   <option value="green">Green Superbike</option>
   <option value="yellow">Yellow Superbike</option>
   <option value="white">White Superbike</option>
  </select>
  <p id="shopInfo">Coins: 0</p>
 </div>
 <button style="width:240px" onclick="startGame()">🏁 START RACE</button>
 <div class="menuButtons">
  <button onclick="enableTilt()">📱 TILT ON</button>
  <button onclick="dailyReward()">🎁 DAILY BONUS</button>
  <button onclick="buyUpgrade()">⚙️ UPGRADE</button>
  <button onclick="showHelp()">❓ HOW TO PLAY</button>
 </div>
 <p id="help">GO: तेज | BRAKE: धीमे | LEFT/RIGHT: मोड़ें | NITRO: Boost</p>
 <p>Best Score: <b id="best">0</b></p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
<script>
"use strict";

const $=id=>document.getElementById(id);
const root=$("game");

let scene,camera,renderer;
let bike=new THREE.Group();
let running=false,paused=false;
let speed=0,score=0;
let coins=Number(localStorage.brpCoins||0);
let best=Number(localStorage.brpBest||0);
let upgrade=Number(localStorage.brpUpgrade||0);
let mapName="city",bikeColor=0xef2349;
let steer=0,steerInput=0;
let gas=false,brake=false,nitroOn=false;
let tiltOn=false,tiltValue=0,tiltZero=null;
let soundOn=true,audio=null,engine=null,engineGain=null;
let spawnClock=0,coinClock=0,crashCooldown=0;
let world=[],traffic=[],pickups=[],marks=[];
let clock=new THREE.Clock();

function material(color,rough=.8){
 return new THREE.MeshStandardMaterial({color,roughness:rough});
}
function addMesh(geo,mat,parent,x=0,y=0,z=0){
 const o=new THREE.Mesh(geo,mat);
 o.position.set(x,y,z);
 o.castShadow=true;o.receiveShadow=true;
 parent.add(o);
 return o;
}
function box(w,h,d,color,x,y,z,parent=scene){
 return addMesh(new THREE.BoxGeometry(w,h,d),material(color),parent,x,y,z);
}

function init3D(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x87c9ee);
 scene.fog=new THREE.Fog(0x87c9ee,45,180);
 camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
 camera.position.set(0,5.5,11);

 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
 renderer.setSize(innerWidth,innerHeight);
 root.appendChild(renderer.domElement);

 scene.add(new THREE.HemisphereLight(0xffffff,0x68704d,2));
 const sun=new THREE.DirectionalLight(0xffffff,2);
 sun.position.set(-20,35,15);
 scene.add(sun);

 scene.add(bike);
 bike.position.set(0,0,4);
 makeBike();
 createMap();
}
function makeBike(){
 bike.clear();
 const black=material(0x10151c,.4);
 const silver=material(0xb6c4d0,.3);

 for(const z of [-1,1]){
  const wheel=addMesh(new THREE.CylinderGeometry(.47,.47,.23,20),black,bike,0,.5,z);
  wheel.rotation.z=Math.PI/2;
  const rim=addMesh(new THREE.TorusGeometry(.31,.035,8,20),silver,bike,0,.5,z);
  rim.rotation.y=Math.PI/2;
 }
 box(.22,.35,1.55,0xaaaaaa,0,.9,0,bike);
 box(.62,.43,.8,bikeColor,0,1.2,-.1,bike);
 box(.48,.16,.62,0x141922,0,1.47,.48,bike);
 box(.22,.5,.25,bikeColor,0,1.05,-.72,bike);
 box(.85,.08,.1,0xb7c2cc,0,1.48,-.9,bike);

 // Rider
 const rider=addMesh(new THREE.CylinderGeometry(.25,.32,.85,16),black,bike,0,2.05,.05);
 rider.rotation.x=-.35;
 addMesh(new THREE.SphereGeometry(.31,16,12),material(0xf3f3f3,.2),bike,0,2.66,-.2);
 box(.38,.12,.1,0x111827,0,2.65,-.45,bike);
 box(.3,.18,.12,0xffff9a,0,1.35,-.94,bike);
 box(.3,.1,.1,0xff0000,0,1.1,.91,bike);
}
function clearWorld(){
 [...world,...traffic,...pickups,...marks].forEach(o=>scene.remove(o));
 world=[];traffic=[];pickups=[];marks=[];
}
function addWorld(o){world.push(o);return o}

function tree(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);addWorld(g);
 addMesh(new THREE.CylinderGeometry(.15,.22,1.7,8),material(0x714321),g,0,.85,0);
 addMesh(new THREE.ConeGeometry(1.25,3,9),material(0x16783a),g,0,2.9,0);
}
function house(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);addWorld(g);
 addMesh(new THREE.BoxGeometry(4,2.6,3.6),material(0xd9b27c),g,0,1.3,0);
 const roof=addMesh(new THREE.ConeGeometry(3,1.7,4),material(0x983f29),g,0,3.35,0);
 roof.rotation.y=Math.PI/4;
}
function building(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);addWorld(g);
 const h=7+Math.random()*14;
 addMesh(new THREE.BoxGeometry(5,h,5),material(0xa5b6c4),g,0,h/2,0);
 for(let y=2;y<h;y+=2){
  for(let x2 of [-1.4,1.4])
   addMesh(new THREE.BoxGeometry(.85,.85,.08),material(0x6da6c1),g,x2,y,2.54);
 }
}
function palm(x,z){
 const g=new THREE.Group();scene.add(g);g.position.set(x,0,z);addWorld(g);
 addMesh(new THREE.CylinderGeometry(.15,.24,3,8),material(0x90653e),g,0,1.5,0);
 for(let i=0;i<7;i++){
  const a=i*Math.PI*2/7;
  const leaf=addMesh(new THREE.BoxGeometry(.2,.12,2.6),material(0x277e36),g,Math.sin(a),3,Math.cos(a));
  leaf.rotation.y=a;
 }
}
function createMap(){
 clearWorld();
 const groundColor=mapName==="desert"?0xc49a59:mapName==="village"?0x347a35:0x4e7350;
 const sky=mapName==="desert"?0xe8b879:mapName==="village"?0x91d1ee:0x87c9ee;
 scene.background.set(sky);scene.fog.color.set(sky);

 addWorld(box(220,.2,300,groundColor,0,-.3,-110));
 addWorld(box(13,.15,300,0x30343a,0,-.17,-110));

 for(let z=-290;z<10;z+=12){
  marks.push(box(.14,.035,5,0xffffff,0,-.075,z));
  for(let x of [-6.35,6.35])marks.push(box(.18,.06,3,0xffe9a5,x,-.07,z));
 }
 if(mapName==="city"){
  for(let z=-285;z<0;z+=13){building(-10,z);building(10,z-6);}
 }else if(mapName==="village"){
  for(let z=-285;z<0;z+=12){
   tree(-10,z);tree(10,z-5);
   if(Math.round(Math.abs(z))%24===0){house(-16,z-4);house(16,z-8);}
  }
 }else if(mapName==="desert"){
  for(let z=-285;z<0;z+=12){palm(-10,z);tree(10,z-5);}
 }else{
  addWorld(box(32,.12,300,0x168cc4,25,-.37,-110));
  for(let z=-285;z<0;z+=15){building(-10,z);tree(10,z);}
  for(let z=-290;z<10;z+=6){
   addWorld(box(.2,1.1,.2,0xe4e8e8,6.8,.5,z));
  }
 }
}

function makeTraffic(type){
 const g=new THREE.Group();scene.add(g);
 const color=type==="truck"?0x3377aa:type==="bus"?0xf1a82e:
 [0xe53939,0x277be0,0xffffff,0x222222][Math.floor(Math.random()*4)];
 const length=type==="truck"?4.5:type==="bus"?4:2.8;
 const width=type==="truck"?1.9:1.65;
 addMesh(new THREE.BoxGeometry(width,.85,length),material(color),g,0,.75,0);
 addMesh(new THREE.BoxGeometry(width*.8,.65,length*.45),material(0x8cc4df),g,0,1.48,-.15);
 for(let x of [-width*.43,width*.43]){
  for(let z of [-length*.32,length*.32]){
   const w=addMesh(new THREE.CylinderGeometry(.28,.28,.18,12),material(0x101010),g,x,.34,z);
   w.rotation.z=Math.PI/2;
  }
 }
 return g;
}
function spawnTraffic(){
 const r=Math.random();
 const type=r<.13?"truck":r<.35?"bus":"car";
 const o=makeTraffic(type);
 o.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-145);
 traffic.push(o);
}
function spawnCoin(){
 const g=new THREE.Group();scene.add(g);
 addMesh(new THREE.TorusGeometry(.42,.12,10,22),material(0xffd12b,.3),g,0,1,0);
 g.position.set([-4,0,4][Math.floor(Math.random()*3)],0,-145);
 pickups.push(g);
}

function audioStart(){
 if(!soundOn)return;
 if(!audio){
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  audio=new AC();
  engine=audio.createOscillator();
  engineGain=audio.createGain();
  engine.type="sawtooth";engine.frequency.value=65;
  engineGain.gain.value=0;
  engine.connect(engineGain);engineGain.connect(audio.destination);
  engine.start();
 }
 if(audio.state==="suspended")audio.resume();
}
function sfx(type){
 if(!soundOn)return;
 audioStart();if(!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.connect(g);g.connect(audio.destination);
 const t=audio.currentTime;
 o.type=type==="crash"?"square":"sine";
 o.frequency.setValueAtTime(type==="coin"?900:type==="nitro"?140:400,t);
 o.frequency.exponentialRampToValueAtTime(70,t+.35);
 g.gain.setValueAtTime(.12,t);
 g.gain.exponentialRampToValueAtTime(.001,t+.4);
 o.start();o.stop(t+.41);
}
function updateAudio(){
 if(audio&&engineGain){
  engine.frequency.setTargetAtTime(65+speed*2,audio.currentTime,.08);
  engineGain.gain.setTargetAtTime(soundOn&&running&&!paused?.025:0,audio.currentTime,.1);
 }
}
function toggleSound(){
 soundOn=!soundOn;
 if(soundOn)audioStart();
 else if(audio&&engineGain)engineGain.gain.setTargetAtTime(0,audio.currentTime,.05);
}

function updateUI(){
 $("speed").textContent=Math.round(speed*2.2);
 $("score").textContent=Math.floor(score);
 $("coins").textContent=coins;
 $("best").textContent=best;
 $("shopInfo").textContent="Coins: "+coins+" | Upgrade: "+upgrade;
 localStorage.brpCoins=coins;
 localStorage.brpBest=best;
 localStorage.brpUpgrade=upgrade;
}

function startGame(){
 try{
  mapName=$("map").value;
  const colors={red:0xef2349,blue:0x168cff,green:0x00b76a,yellow:0xffcf27,white:0xf4f4f4};
  bikeColor=colors[$("color").value]||0xef2349;
  makeBike();createMap();
  bike.position.set(0,0,4);
  speed=0;score=0;steer=0;steerInput=0;
  gas=false;brake=false;nitroOn=false;
  spawnClock=0;coinClock=0;crashCooldown=0;
  running=true;paused=false;
  $("menu").classList.add("hidden");
  $("message").textContent="";
  audioStart();sfx("start");
  updateUI();updateAudio();
 }catch(e){
  console.error(e);
  $("message").textContent="गेम शुरू नहीं हुआ। Refresh करें।";
 }
}
function finishGame(){
 if(!running)return;
 running=false;gas=false;nitroOn=false;
 sfx("crash");
 if(score>best)best=Math.floor(score);
 updateUI();
 $("message").textContent="💥 GAME OVER";
 $("menu").classList.remove("hidden");
 updateAudio();
}
function pauseGame(){
 if(!running)return;
 paused=!paused;
 $("message").textContent=paused?"⏸ PAUSED":"";
 updateAudio();
}
function dailyReward(){
 const today=new Date().toDateString();
 if(localStorage.brpDaily===today){alert("आज का बोनस पहले ही ले चुके हैं!");return;}
 localStorage.brpDaily=today;
 coins+=200;updateUI();sfx("coin");
 alert("🎁 200 Coins मिले!");
}
function buyUpgrade(){
 if(upgrade>=5){alert("Maximum upgrade पूरा हो गया!");return;}
 if(coins<300){alert("Upgrade के लिए 300 coins चाहिए।");return;}
 coins-=300;upgrade++;updateUI();
 alert("Upgrade Level "+upgrade+" हो गया! अब बाइक की स्पीड बढ़ेगी।");
}
function showHelp(){
 $("help").textContent="GO: तेज | BRAKE: धीमे | NITRO: Boost | LEFT/RIGHT: मोड़ें | फोन झुकाकर भी मोड़ सकते हैं।";
}

function nitroPress(){if(running&&!paused){nitroOn=true;sfx("nitro");}}
function nitroRelease(){nitroOn=false;}

function bindButton(id,down,up){
 const el=$(id);
 el.addEventListener("pointerdown",e=>{e.preventDefault();audioStart();down();});
 ["pointerup","pointercancel","pointerleave"].forEach(type=>{
  el.addEventListener(type,e=>{e.preventDefault();up();});
 });
}
bindButton("left",()=>steerInput=-1,()=>steerInput=0);
bindButton("right",()=>steerInput=1,()=>steerInput=0);
bindButton("gas",()=>gas=true,()=>gas=false);
bindButton("brake",()=>brake=true,()=>brake=false);
bindButton("nitro",nitroPress,nitroRelease);

window.addEventListener("keydown",e=>{
 if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key))e.preventDefault();
 if(e.key==="ArrowLeft"||e.key==="a")steerInput=-1;
 if(e.key==="ArrowRight"||e.key==="d")steerInput=1;
 if(e.key==="ArrowUp"||e.key==="w")gas=true;
 if(e.key==="ArrowDown"||e.key==="s")brake=true;
 if(e.code==="Space")nitroPress();
});
window.addEventListener("keyup",e=>{
 if(["ArrowLeft","ArrowRight","a","d"].includes(e.key))steerInput=0;
 if(e.key==="ArrowUp"||e.key==="w")gas=false;
 if(e.key==="ArrowDown"||e.key==="s")brake=false;
 if(e.code==="Space")nitroRelease();
});

async function enableTilt(){
 try{
  if(!("DeviceOrientationEvent" in window)){
   alert("इस फोन में Motion Sensor उपलब्ध नहीं है। Touch buttons इस्तेमाल करें।");
   return;
  }
  if(typeof DeviceOrientationEvent.requestPermission==="function"){
   const p=await DeviceOrientationEvent.requestPermission();
   if(p!=="granted")throw new Error("Permission denied");
  }
  tiltOn=true;tiltZero=null;tiltValue=0;
  $("tiltStatus").textContent="📱 Tilt: ON";
  $("help").textContent="फोन सीधा रखें और फिर बाएँ-दाएँ झुकाएँ।";
  if(!window.brpTiltListener){
   window.brpTiltListener=true;
   window.addEventListener("deviceorientation",e=>{
    if(e.gamma===null||e.gamma===undefined)return;
    if(tiltZero===null)tiltZero=e.gamma;
    tiltValue=THREE.MathUtils.clamp((e.gamma-tiltZero)/25,-1,1);
   });
  }
 }catch(e){
  alert("Motion Permission नहीं मिली। Chrome Settings में Motion Sensors Allow करें।");
 }
}

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),.04);

 if(running&&!paused){
  const baseMax=45+upgrade*7;
  const maxSpeed=nitroOn?Math.min(100,baseMax+35):gas?baseMax:brake?8:22;
  speed=THREE.MathUtils.lerp(speed,maxSpeed,dt*1.8);

  // Tilt and touch controls work together
  const input=THREE.MathUtils.clamp(steerInput+(tiltOn?tiltValue:0),-1,1);
  steer=THREE.MathUtils.lerp(steer,input,dt*5);
  bike.position.x=THREE.MathUtils.clamp(bike.position.x+steer*speed*dt*.075,-5.2,5.2);
  bike.rotation.z=THREE.MathUtils.lerp(bike.rotation.z,-steer*.42,dt*5);

  const movement=speed*dt*.65;
  marks.forEach(o=>{
   o.position.z+=movement;
   if(o.position.z>9)o.position.z-=300;
  });
  world.forEach(o=>{
   o.position.z+=movement;
   if(o.position.z>15)o.position.z-=300;
  });

  spawnClock+=dt;
  if(spawnClock>Math.max(.8,2.3-speed*.012)){
   spawnTraffic();spawnClock=0;
  }
  for(let i=traffic.length-1;i>=0;i--){
   const o=traffic[i];
   o.position.z+=movement;
   if(o.position.z>12){
    scene.remove(o);traffic.splice(i,1);continue;
   }
   if(Math.abs(o.position.z-bike.position.z)<2.1&&
      Math.abs(o.position.x-bike.position.x)<1.55&&crashCooldown<=0){
    crashCooldown=2;
    finishGame();
   }
  }
  crashCooldown=Math.max(0,crashCooldown-dt);

  coinClock+=dt;
  if(coinClock>2.4){spawnCoin();coinClock=0;}
  for(let i=pickups.length-1;i>=0;i--){
   const o=pickups[i];
   o.position.z+=movement;
   o.rotation.y+=dt*2;
   if(Math.abs(o.position.z-bike.position.z)<2&&
      Math.abs(o.position.x-bike.position.x)<1.5){
    coins+=10;sfx("coin");updateUI();
    scene.remove(o);pickups.splice(i,1);continue;
   }
   if(o.position.z>12){
    scene.remove(o);pickups.splice(i,1);
   }
  }
  score+=speed*dt*.8;
  updateUI();updateAudio();
 }

 camera.position.x=THREE.MathUtils.lerp(camera.position.x,bike.position.x*.35,dt*3);
 camera.position.y=5.5;
 camera.position.z=11;
 camera.lookAt(bike.position.x*.25,1,-8);
 renderer.render(scene,camera);
}

function resize(){
 if(!renderer)return;
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
}
window.addEventListener("resize",resize);

window.startGame=startGame;
window.enableTilt=enableTilt;
window.dailyReward=dailyReward;
window.buyUpgrade=buyUpgrade;
window.showHelp=showHelp;
window.pauseGame=pauseGame;
window.toggleSound=toggleSound;

try{
 init3D();
 updateUI();
 animate();
}catch(e){
 console.error(e);
 $("message").textContent="3D गेम लोड नहीं हुआ। Internet जाँचकर Refresh करें।";
}
</script>
</body>
</html>
