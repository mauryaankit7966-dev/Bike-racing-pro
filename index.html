
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Bike Racing Pro 3D</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#07101e;color:white;font-family:Arial;overflow:hidden}
header{text-align:center;background:#101c30;padding:12px;color:#ff2855;font-size:25px;font-weight:bold}
#stats{display:flex;justify-content:space-around;padding:12px;background:#050b16;font-size:15px}
#game{width:100%;height:65vh;display:block}
#menu{text-align:center;background:#07101e;padding:8px}
button,select{background:#ff2855;color:white;border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-weight:bold;margin:4px}
#controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:8px}
#controls button{height:65px;font-size:18px}
#extra{display:flex;justify-content:space-around}
#extra button{width:42%;height:58px}
#message{text-align:center;color:#ffd34d;padding:4px;font-size:14px}
</style>
</head>
<body>

<header>🏍️ BIKE RACING PRO 3D</header>

<div id="stats">
<span>Speed: <b id="speed">0</b> KM/H</span>
<span>Score: <b id="score">0</b></span>
<span>Coins: <b id="coins">0</b></span>
</div>

<div id="menu">
<select id="map">
<option value="city">🏙️ CITY MAP</option>
<option value="village">🌳 VILLAGE MAP</option>
<option value="desert">🏜️ DESERT MAP</option>
</select>
<button onclick="startGame()">START GAME</button>
<button onclick="tiltPermission()">📱 TILT ON</button>
</div>

<div id="game"></div>

<div id="message">Map चुनें और START GAME दबाएं</div>

<div id="controls">
<button id="left">⬅ LEFT</button>
<button id="right">RIGHT ➡</button>
<button onclick="nitro()">⚡ NITRO</button>
</div>

<div id="extra">
<button id="go">GO ▲</button>
<button id="brake">BRAKE ▼</button>
<button onclick="pauseGame()">⏸ PAUSE</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const container=document.getElementById("game");

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x75b9e8);
scene.fog=new THREE.Fog(0x75b9e8,35,110);

const camera=new THREE.PerspectiveCamera(
65,window.innerWidth/(window.innerHeight*.65),.1,200
);
camera.position.set(0,6,11);
camera.lookAt(0,0,-10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight*.65);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
container.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff,0x555555,2));

const sun=new THREE.DirectionalLight(0xffffff,2);
sun.position.set(-5,10,5);
scene.add(sun);

function box(w,h,d,color,x,y,z){
const m=new THREE.Mesh(
new THREE.BoxGeometry(w,h,d),
new THREE.MeshStandardMaterial({color})
);
m.position.set(x,y,z);
scene.add(m);
return m;
}

const road=box(12,.15,130,0x30343b,0,-.1,-50);
const ground=box(180,.2,140,0x28783a,0,-.25,-50);

let bike=new THREE.Group();
scene.add(bike);
bike.position.set(0,.5,3);

function cylinder(radius,length,color,x,y,z,rot=0){
let m=new THREE.Mesh(
new THREE.CylinderGeometry(radius,radius,length,20),
new THREE.MeshStandardMaterial({color})
);
m.position.set(x,y,z);
m.rotation.z=rot;
bike.add(m);
return m;
}

// Bike wheels
cylinder(.43,.22,0x111111,0,.1,.65,Math.PI/2);
cylinder(.43,.22,0x111111,0,.1,-.65,Math.PI/2);

// Bike body
box(.42,.65,.95,0xff174b,0,.65,0);
box(.55,.16,.45,0x151515,0,1.02,.12);
box(.12,.65,.12,0xaaaaaa,0,.65,-.55);
box(.65,.1,.12,0x222222,0,1.05,-.65);

// Headlight
box(.3,.25,.15,0xffff88,0,.75,-.58);

let leftObjects=[];
let obstacles=[];
let roadLines=[];

function clearWorld(){
[...leftObjects,...obstacles,...roadLines].forEach(o=>scene.remove(o));
leftObjects=[];
obstacles=[];
roadLines=[];
}

function makeTree(x,z,type){
let g=new THREE.Group();

if(type==="desert"){
let trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.12,.18,1.6,8),
new THREE.MeshStandardMaterial({color:0x997344})
);
trunk.position.y=.8;
g.add(trunk);
let cactus=new THREE.Mesh(
new THREE.CylinderGeometry(.32,.32,2.1,8),
new THREE.MeshStandardMaterial({color:0x278b36})
);
cactus.position.y=1.8;
g.add(cactus);
}else{
let trunk=new THREE.Mesh(
new THREE.CylinderGeometry(.13,.2,1.5,8),
new THREE.MeshStandardMaterial({color:0x80502b})
);
trunk.position.y=.75;
g.add(trunk);

let leaves=new THREE.Mesh(
new THREE.ConeGeometry(1,2.5,8),
new THREE.MeshStandardMaterial({
color:type==="village"?0x167d29:0x218d40
})
);
leaves.position.y=2.4;
g.add(leaves);
}

g.position.set(x,0,z);
scene.add(g);
leftObjects.push(g);
}

function makeHouse(x,z){
let g=new THREE.Group();

let wall=new THREE.Mesh(
new THREE.BoxGeometry(3,2,3),
new THREE.MeshStandardMaterial({color:0xd5a56b})
);
wall.position.y=1;
g.add(wall);

let roof=new THREE.Mesh(
new THREE.ConeGeometry(2.4,1.4,4),
new THREE.MeshStandardMaterial({color:0x963e27})
);
roof.position.y=2.7;
roof.rotation.y=Math.PI/4;
g.add(roof);

g.position.set(x,0,z);
scene.add(g);
leftObjects.push(g);
}

function makeBuilding(x,z){
let h=4+Math.random()*9;
let b=box(3,h,3,0x8795a5,x,h/2,z);
leftObjects.push(b);
}

function createMap(){
clearWorld();

let map=document.getElementById("map").value;

if(map==="city"){
scene.background.set(0x8ac7ed);
scene.fog.color.set(0x8ac7ed);
ground.material.color.set(0x555b5b);
for(let z=-110;z<10;z+=9){
makeBuilding(-10,z);
makeBuilding(10,z);
}
}else if(map==="village"){
scene.background.set(0x83d1ee);
scene.fog.color.set(0x83d1ee);
ground.material.color.set(0x338b38);

for(let z=-110;z<10;z+=8){
makeTree(-10,z,"village");
makeTree(10,z-4,"village");
if(z%16===0){
makeHouse(-15,z-2);
makeHouse(15,z-5);
}
}
}else{
scene.background.set(0xe9b66d);
scene.fog.color.set(0xe9b66d);
ground.material.color.set(0xc69a52);

for(let z=-110;z<10;z+=8){
makeTree(-10,z,"desert");
makeTree(10,z-4,"desert");
}
}

// Lane markings
for(let z=-110;z<10;z+=9){
let line=box(.13,.03,4,0xffffff,0,.01,z);
roadLines.push(line);
}

// Obstacles
for(let i=0;i<8;i++){
let color=map==="village"?0x2288ff:
map==="desert"?0x996633:0xffaa00;

let o=box(1.1,1.4,1.4,color,
[-3,0,3][Math.floor(Math.random()*3)],
.7,-20-i*14);

obstacles.push(o);
}
}

let speed=0,score=0,coins=0;
let running=false,paused=false;
let movingLeft=false,movingRight=false;
let nitroActive=false;
let audio=null;
let engineGain=null;

function sound(){
if(!audio){
audio=new (window.AudioContext||window.webkitAudioContext)();
let oscillator=audio.createOscillator();
engineGain=audio.createGain();
oscillator.type="sawtooth";
oscillator.frequency.value=75;
engineGain.gain.value=0;
oscillator.connect(engineGain);
engineGain.connect(audio.destination);
oscillator.start();
}
if(audio.state==="suspended")audio.resume();
}

function updateSound(){
if(engineGain){
engineGain.gain.setTargetAtTime(
running&&!paused?.025:0,audio.currentTime,.1
);
}
}

function startGame(){
sound();
createMap();
score=0;
coins=0;
speed=0;
bike.position.x=0;
running=true;
paused=false;
document.getElementById("message").innerText="🏁 RACE START!";
updateSound();
}

function pauseGame(){
paused=!paused;
document.getElementById("message").innerText=
paused?"GAME PAUSED":"RACE CONTINUED";
updateSound();
}

function nitro(){
if(running&&!paused){
nitroActive=true;
setTimeout(()=>nitroActive=false,3000);
}
}

function moveBike(direction){
if(!running||paused)return;
bike.position.x+=direction*.55;
bike.position.x=Math.max(-4,Math.min(4,bike.position.x));
bike.rotation.z=-direction*.15;
}

function holdButton(id,callback){
let el=document.getElementById(id);
el.addEventListener("touchstart",e=>{
e.preventDefault();callback(true);
},{passive:false});
el.addEventListener("touchend",()=>callback(false));
el.addEventListener("mousedown",()=>callback(true));
el.addEventListener("mouseup",()=>callback(false));
el.addEventListener("mouseleave",()=>callback(false));
}

holdButton("left",v=>movingLeft=v);
holdButton("right",v=>movingRight=v);
holdButton("go",v=>speed=v?150:0);
holdButton("brake",v=>speed=v?35:0);

let tilt=0;

function tiltPermission(){
if(typeof DeviceOrientationEvent!=="undefined" &&
typeof DeviceOrientationEvent.requestPermission==="function"){
DeviceOrientationEvent.requestPermission().then(result=>{
if(result==="granted")window.addEventListener("deviceorientation",tiltControl);
});
}else{
window.addEventListener("deviceorientation",tiltControl);
}
document.getElementById("message").innerText="📱 TILT CONTROL ON";
}

function tiltControl(e){
if(e.gamma!==null){
tilt=e.gamma;
}
}

let last=0;

function animate(time){
requestAnimationFrame(animate);

let dt=Math.min((time-last)/16.67,2);
last=time;

if(running&&!paused){

if(movingLeft)moveBike(-.07*dt);
if(movingRight)moveBike(.07*dt);

if(Math.abs(tilt)>5){
bike.position.x-=tilt*.0009*dt*speed/40;
}
bike.position.x=Math.max(-4,Math.min(4,bike.position.x));

speed=Math.min(200,speed+(nitroActive?1.2:.08));
score+=Math.round(speed*.02*dt);

roadLines.forEach(line=>{
line.position.z+=speed*.012*dt;
if(line.position.z>8)line.position.z=-110;
});

leftObjects.forEach(o=>{
o.position.z+=speed*.012*dt;
if(o.position.z>12)o.position.z=-110-Math.random()*30;
});

obstacles.forEach(o=>{
o.position.z+=speed*.012*dt;
if(o.position.z>5){
o.position.z=-110-Math.random()*30;
o.position.x=[-3,0,3][Math.floor(Math.random()*3)];
coins+=1;
}
if(Math.abs(o.position.z-bike.position.z)<1.3 &&
Math.abs(o.position.x-bike.position.x)<.9){
speed=0;
running=false;
document.getElementById("message").innerText="💥 GAME OVER! START AGAIN";
updateSound();
}
});

}

document.getElementById("speed").innerText=Math.round(speed);
document.getElementById("score").innerText=score;
document.getElementById("coins").innerText=coins;

renderer.render(scene,camera);
}

createMap();
requestAnimationFrame(animate);

window.addEventListener("resize",()=>{
camera.aspect=window.innerWidth/(window.innerHeight*.65);
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight*.65);
});
</script>
</body>
</html>
